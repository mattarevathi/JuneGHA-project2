name: GHA workflow
on: 
  push: 
    branches: 
       - main
  pull_request:
     branches:
       - main
jobs: 
  test:
   runs-on: "ubuntu-latest"
   steps:
    - name: Get code
      uses: actions/checkout@v7
    - name: Install node
      uses: actions/setup-node@v7
      with: 
       node-version: '24'
    - name: install dependencies
      run: npm ci
    - name: Run tests
      run: npm test
  Build:
    needs: test
    runs-on: "ubuntu-latest"
    steps: 
      - name: Get code
        uses: actions/checkout@v7
      - name: Install code
        uses: actions/setup-node@v7
      - name: Install dependencies
        run: npm ci
      - name: Build application
        run: npm run build
      - name: upload artifact
        uses: actions/upload-artifact@v3
        with:
           name: dist-file
           path: dist
  Deploy:
    needs: Build
    runs-on: "ubuntu-latest"
    steps:
      - name: Download artifact
        uses: actions/Download-artifact@v8
        with:
          name: dist-file
      - name: list-file
        run: ls -la
      - name: deploy
        run: echo deploying......


      
